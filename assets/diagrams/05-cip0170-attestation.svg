ke-width="1.5" fill="#FFFFFF"/><text x="70" y="470" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;font-weight:700;" fill="#1F1B1D" text-anchor="start">icp</text><text x="70" y="492" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;font-weight:500;" fill="#6E676B" text-anchor="start">s = 0  inception</text><rect x="320" y="444" width="250" height="80" rx="12" stroke="#FF3DA6" stroke-width="2" fill="#FFFFFF"/><text x="340" y="470" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;font-weight:700;" fill="#1F1B1D" text-anchor="start">ixn</text><text x="340" y="492" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;font-weight:600;" fill="#E02690" text-anchor="start">s = 1  seal { d }</text><line x1="290" y1="484" x2="320" y2="484" stroke="#6E676B" stroke-width="2" marker-end="url(#ahg)"/><line x1="500" y1="254" x2="445" y2="444" stroke="#6E676B" stroke-width="2" marker-end="url(#ahg)"/><text x="300" y="286" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10.5px;font-weight:500;" fill="#6E676B" text-anchor="middle">anchored, not just signed</text><text x="50" y="556" style="font-family:'Fredoka',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:500;" fill="#6E676B" text-anchor="start">Survives key rotation — the record outlives the keys that made it.</text><rect x="670" y="346" width="520" height="58" rx="12" stroke="#D8D2D5" stroke-width="1.5" fill="#FFFFFF"/><text x="684" y="373.0" style="font-family:'Fredoka',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14.5px;font-weight:600;" fill="#1F1B1D" text-anchor="start">learner-demo wallet</text><text x="684" y="391.0" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;font-weight:400;" fill="#6E676B" text-anchor="start">funded independently from the faucet</text><rect x="670" y="432" width="520" height="92" rx="12" stroke="#E02690" stroke-width="1.5" fill="#FFE3F2"/><text x="690" y="458" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;font-weight:700;" fill="#E02690" text-anchor="start">Builds · signs · submits · PAYS THE FEE</text><text x="690" y="482" style="font-family:'Fredoka',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:500;" fill="#1F1B1D" text-anchor="start">~0.3 ADA. Never funded by AceSpeak, and no transfer</text><text x="690" y="500" style="font-family:'Fredoka',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:500;" fill="#1F1B1D" text-anchor="start">ever passes between the two wallets.</text><text x="670" y="556" style="font-family:'Fredoka',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:500;" fill="#6E676B" text-anchor="start">Catalyst counts a fee only when it is not paid from the applicant's wallets.</text><rect x="220" y="636" width="800" height="120" rx="14" stroke="#FF3DA6" stroke-width="2" fill="#FFFFFF"/><text x="250" y="666" style="font-family:'Fredoka',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14.5px;font-weight:700;" fill="#1F1B1D" text-anchor="start">ATTEST  ·  Cardano preprod transaction</text><text x="250" y="692" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;font-weight:600;" fill="#E02690" text-anchor="start">"170": { t: ATTEST, i: &lt;AceSpeak AID&gt;, d: &lt;digest&gt;, s: &lt;seq&gt;, v: {v:1.0} }</text><text x="250" y="712" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;font-weight:500;" fill="#6E676B" text-anchor="start">"170170": { the credential payload itself }</text><text x="250" y="736" style="font-family:'Fredoka',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:11.5px;font-weight:600;" fill="#1F1B1D" text-anchor="start">Signed by the learner's wallet. Carries AceSpeak's identifier. Both are true at once.</text><line x1="310" y1="596" x2="420" y2="636" stroke="#6E676B" stroke-width="2" marker-end="url(#ahg)"/><line x1="930" y1="596" x2="820" y2="636" stroke="#6E676B" stroke-width="2" marker-end="url(#ahg)"/><rect x="220" y="796" width="380" height="68" rx="12" stroke="#D8D2D5" stroke-width="1.5" fill="#FFFFFF"/><text x="234" y="828.0" style="font-family:'Fredoka',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14.5px;font-weight:600;" fill="#1F1B1D" text-anchor="start">Public verifier</text><text x="234" y="846.0" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;font-weight:400;" fill="#6E676B" text-anchor="start">verify.ts — needs only the tx hash</text><rect x="640" y="796" width="380" height="68" rx="12" stroke="#E02690" stroke-width="1.5" fill="#FFE3F2"/><text x="660" y="822" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;font-weight:700;" fill="#E02690" text-anchor="start">VALID</text><text x="660" y="844" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;font-weight:500;" fill="#1F1B1D" text-anchor="start">digest re-derives · seal found at s in the KEL</text><line x1="620" y1="756" x2="410" y2="796" stroke="#6E676B" stroke-width="2" marker-end="url(#ahg)"/><line x1="600" y1="830" x2="640" y2="830" stroke="#6E676B" stroke-width="2" marker-end="url(#ahg)"/></svg>